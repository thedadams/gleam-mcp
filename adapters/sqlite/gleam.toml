name = "gleam_mcp_sqlite"
version = "0.1.0"
description = "SQLite session and task stores for single-replica gleam_mcp servers"
licences = ["MIT"]
repository = { type = "github", user = "thedadams", repo = "gleam-mcp", path = "adapters/sqlite" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_time = ">= 1.7.0 and < 2.0.0"
gleam_mcp = { path = "../.." }
sqlight = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
