name = "gleam_mcp_postgres"
version = "0.1.0"
description = "PostgreSQL session and task stores for gleam_mcp servers"
licences = ["MIT"]
repository = { type = "github", user = "thedadams", repo = "gleam-mcp", path = "adapters/postgres" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_time = ">= 1.7.0 and < 2.0.0"
gleam_mcp = { path = "../.." }
pog = ">= 4.1.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.1.0 and < 2.0.0"
